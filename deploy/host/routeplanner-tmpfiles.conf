# /run is tmpfs. These directories hold the secrets vault-agent renders; they
# exist only in memory and vanish on reboot, which is the intent.
#
# Install: cp to /etc/tmpfiles.d/routeplanner.conf && systemd-tmpfiles --create
#
# 1200 is the vault-agent uid/gid. Each consumer container joins group 1200
# and mounts only its own subdirectory.
d /run/routeplanner                 0755 root root -
d /run/routeplanner/secrets         0750 root 1200 -
d /run/routeplanner/secrets/app     0750 1200 1200 -
d /run/routeplanner/secrets/build   0750 1200 1200 -
d /run/routeplanner/secrets/postgres 0750 1200 1200 -
d /run/routeplanner/secrets/garage  0750 1200 1200 -
d /run/routeplanner/secrets/backup  0750 1200 1200 -
